name: Deploy Benchmark and Documentation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.7.7

      - name: Create benchmark report (Criterion)
        run: cargo bench --bench rrdu_benchmarks

      - name: Copy changelog and migration to docs
        run: |
          cp CHANGELOG.md docs/src/history/changelog.md
          cp MIGRATION.md docs/src/history/migration.md

      - name: Install mdBook
        uses: taiki-e/install-action@0f9abeadd7b421a211fafd01ed6005a20d796e1e # v2.66.4
        with:
          tool: mdbook

      - name: Build mdBook
        run: mdbook build docs

      - name: Copy benchmark report to mdbook output
        run: |
          mkdir -p docs/book/quality/criterion
          cp -r target/criterion/* docs/book/quality/criterion/

      - name: Test if copy succeeded
        run: test -f docs/book/quality/criterion/report/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
