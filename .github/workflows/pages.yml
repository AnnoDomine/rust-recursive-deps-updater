name: Deploy Benchmark and Documentation

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Create benchmark report (Criterion)
        run: cargo bench --bench rrdu_benchmarks

      - name: Copy root markdowns to docs
        run: |
          cp CHANGELOG.md docs/src/history/changelog.md
          cp MIGRATION.md docs/src/history/migration.md
          cp ACCESSIBILITY.md docs/src/accessibility.md
          cp SECURITY.md docs/src/quality/security.md

      - name: Install mdBook & preprocessors
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: mdbook,mdbook-variables

      - name: Build mdBook
        run: |
          export RRDU_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          mdbook build docs

      - name: Copy benchmark report to mdbook output
        run: |
          mkdir -p docs/book/quality/criterion
          cp -r target/criterion/* docs/book/quality/criterion/

      - name: Test if copy succeeded
        run: test -f docs/book/quality/criterion/report/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
