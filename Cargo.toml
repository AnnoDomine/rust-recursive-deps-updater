[package]
name = "rust-recursive-deps-updater"
version = "0.0.4"
edition = "2024"
rust-version = "1.98.1"
authors = ["Dominic Seel"]
description = "A fast, safe, zero-privilege recursive Cargo dependency updater for Rust workspaces and standalone crates."
license = "GPL-3.0-or-later"
repository = "https://github.com/AnnoDomine/rust-recursive-deps-updater"
homepage = "https://github.com/AnnoDomine/rust-recursive-deps-updater/releases"
documentation = "https://docs.rs/crate/rust-recursive-deps-updater"
readme = "README.md"
keywords = ["cargo", "dependencies", "updater", "workspace", "semver"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[lib]
name = "rrdu"
path = "src/lib.rs"

[[bin]]
name = "rrdu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
comfy-table = { package = "comfy-table-inline", version = "8.0.2" }
indicatif = "0.18.6"
log = "0.4.34"
noyalib = "0.0.56"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simple_logger = { version = "5.2.0", features = ["timestamps", "colors"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros"] }
toml_edit = "0.25.16"
ureq = { version = "3.4.2", features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
criterion = "0.8.2"

[profile.release]
opt-level = 1
lto = true
codegen-units = 1
panic = "abort"
strip = true
